<div class="grid grid-nogutter surface-0 text-800">
    <!-- Login form --->
    <div class="col-12 md:col-4 p-3 text-center md:text-left flex align-items-center">
        <section>
            <span class="block text-5xl font-bold mb-1">Web Code Challengue</span>
            <div class="text-5xl text-primary font-bold mb-3">what your visitors want to see</div>
            <p class="mt-0 mb-4 text-700 line-height-3">Web Code Challengue it's a demo App for you.</p>
            
            <p-messages></p-messages>

            <form [formGroup]="loginForm">
                <div>
                    <label for="username" class="block text-900 font-medium mb-2">Username</label>
                    <input  #username id="username" type="text" pInputText class="w-full mb-2" formControlName="username" autofocus>
                    <small [hidden]="loginForm.controls.username.valid || loginForm.controls.username.pristine" class="p-error">Enter your username</small>

                    <label for="password" class="block text-900 font-medium mb-2">Password</label>
                    <input id="password" type="password" pInputText class="w-full mb-2" formControlName="password"
                           [ngClass]="{'error' : loginError === true, 'ok': loginError === false}">
                    <small [hidden]="loginForm.controls.password.valid || loginForm.controls.password.pristine" class="p-error">Enter your password</small>

                    <button pButton pRipple id="btn-login" label="Sign In" class="w-full" (click)="onSubmit($event)"
                            [disabled]="!loginForm.valid">
                    </button>
                </div>
            </form>
        </section>
    </div>

    <!-- Login logo --->
    <div class="col-12 md:col-8 overflow-hidden">
        <img src="assets/images/hero-1.png" alt="Image" class="login-image">
    </div>
</div>
